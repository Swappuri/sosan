<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2d2d2d">
  <title>sosan</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preload" href="./fonts/Poppins-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./fonts/Tektur.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./editor-theme.css">
</head>
<body data-view="preview">
  <header class="app-header">
    <a class="brand" href="./" aria-label="sosan home"><span aria-hidden="true"><span class="brand-initial">s</span><svg class="brand-o" viewBox="0 0 24 24"><defs><linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1"><stop class="ring-primary" offset="0%"/><stop class="ring-secondary" offset="100%"/></linearGradient></defs><circle cx="12" cy="12" r="9.5" fill="none" stroke="url(#brand-gradient)" stroke-width="2.5"/></svg>san</span></a>
    <button id="export" class="primary" disabled>Export video </button>
  </header>
  <nav class="view-switch" aria-label="Workspace view">
    <button data-view="preview" aria-pressed="true" aria-controls="preview-panel">Preview</button>
    <button data-view="settings" aria-pressed="false" aria-controls="settings-panel">Settings</button>
  </nav>
  <main>
    <section class="workspace panel" id="preview-panel" aria-label="Preview and playback">
      <div class="panel-heading"><h1>Preview</h1><span id="resolution-label" class="panel-meta">1280 × 720</span></div>
      <div class="stage" id="stage">
        <canvas id="visualizer" width="1280" height="720" aria-label="Live audio-reactive visualizer"></canvas>
        <div class="empty-state" id="empty-state">
          <svg class="upload-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 16v4h16v-4"/></svg>
          <h2>Add audio</h2><p>Drop an MP3 or WAV file.</p>
          <button class="primary" id="stage-browse">Choose file</button>
        </div>
      </div>
      <div class="transport">
        <input id="seek" type="range" min="0" max="100" value="0" step="0.01" aria-label="Song position" disabled>
        <div class="transport-row">
          <div class="transport-left">
            <button id="play" class="play" aria-label="Play" title="Play / pause (Space)" disabled>▶</button>
            <div class="preview-volume">
              <button id="volume-toggle" class="icon-button" aria-label="Mute preview" aria-expanded="false" aria-controls="volume-popover" title="Mute preview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="volume-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="volume-slash" d="m15 9 6 6m0-6-6 6"/></svg></button>
              <div id="volume-popover" class="volume-popover" inert>
                <input id="preview-volume" type="range" min="0" max="100" value="100" step="1" aria-label="Preview volume" aria-valuetext="100 percent" aria-orientation="horizontal">
              </div>
            </div>
            <span class="time playback-time"><span id="elapsed">0:00</span><span class="time-separator"> / </span><span id="duration">0:00</span></span>
          </div>
          <button id="fullscreen" class="icon-button fullscreen-button" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fullscreen-enter" d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><path class="fullscreen-exit" d="M3 8h5V3m8 0v5h5M8 21v-5H3m18 0h-5v5"/></svg></button>
        </div>
      </div>
      <section class="export-panel" id="export-panel" hidden aria-live="polite">
        <div><strong id="export-title">Rendering…</strong><span id="export-detail"></span></div>
        <progress id="export-progress" value="0" max="100" aria-label="Export progress"></progress>
        <button id="cancel-export" class="secondary">Cancel</button>
        <a id="export-download" class="primary" hidden>Download MP4</a>
      </section>
    </section>
    <aside class="settings panel" id="settings-panel" aria-label="Visualizer settings">
      <div class="panel-heading"><h2>Settings</h2><button id="reset" class="text-button" disabled>Reset all</button></div>
      <nav id="settings-section-links" class="settings-section-links" aria-label="Jump to settings section"></nav>
      <div class="settings-content" tabindex="0" aria-label="Settings controls">
        <section class="control-section audio-settings">
          <div class="section-heading"><h3>Audio</h3><button class="text-button" data-reset="audio" aria-label="Reset audio" disabled>Reset</button></div>
          <div class="file-card" id="audio-card"><button id="dropzone" class="dropzone"><svg class="file-add-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg><span class="file-copy"><strong id="audio-name">Add audio</strong><small id="audio-hint">MP3, WAV · drop or browse</small></span></button><button id="audio-remove" class="text-button file-remove" aria-label="Remove audio" hidden><span>Remove</span></button></div>
          <input id="audio-file" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav" hidden>
        </section>
        <fieldset class="control-section appearance-settings" aria-label="Appearance" disabled>
          <div class="section-heading"><h3>Appearance</h3><button class="text-button" data-reset="appearance" aria-label="Reset appearance">Reset</button></div>
          <div class="style-choices" role="radiogroup" aria-label="Spectrum style">
            <label class="style-choice"><input class="sr-only" type="radio" name="spectrum-style" value="bars" checked><span><svg viewBox="0 0 24 20" aria-hidden="true"><path d="M3 8v4M7 4v12M12 1v18M17 4v12M21 8v4"/></svg>Bars</span></label>
            <label class="style-choice"><input class="sr-only" type="radio" name="spectrum-style" value="wave"><span><svg viewBox="0 0 24 20" aria-hidden="true"><path d="M1 10C5 10 3 2 7 2S9 18 13 18s2-16 6-16 2 8 4 8"/></svg>Wave</span></label>
          </div>
          <div class="shape-choices style-choices" role="radiogroup" aria-label="Shape">
            <label class="style-choice"><input class="sr-only" type="radio" name="shape" value="circle" checked><span><svg viewBox="0 0 24 20" aria-hidden="true"><circle cx="12" cy="10" r="8"/></svg>Circle</span></label>
            <label class="style-choice"><input class="sr-only" type="radio" name="shape" value="square"><span><svg viewBox="0 0 24 20" aria-hidden="true"><path d="M4 2h16v16H4z"/></svg>Square</span></label>
            <label class="style-choice"><input class="sr-only" type="radio" name="shape" value="triangle"><span><svg viewBox="0 0 24 20" aria-hidden="true"><path d="M12 2 22 18H2z"/></svg>Triangle</span></label>
          </div>
          <button id="innerRing" class="decoration-button" type="button" aria-pressed="true">Inset outline</button>
        </fieldset>
        <fieldset class="control-section colors-settings" disabled>
          <div class="section-heading"><h3>Colors</h3><button class="text-button" data-reset="colors" aria-label="Reset colors">Reset</button></div>
          <div class="color-row">
            <label class="color-card" for="primary-color"><span class="color-caption">Primary</span><input id="primary-color" type="color" value="#59ff9b"><output id="primary-color-value" for="primary-color">#59FF9B</output></label>
            <label class="color-card" for="secondary-color"><span class="color-caption">Secondary</span><input id="secondary-color" type="color" value="#59ff9b"><output id="secondary-color-value" for="secondary-color">#59FF9B</output></label>
            <label class="color-card" for="innerFill-color"><span class="color-caption">Surface</span><input id="innerFill-color" type="color" value="#0b1114"><output id="innerFill-color-value" for="innerFill-color">#0B1114</output></label>
            <label class="color-card" for="background-color"><span class="color-caption">Background</span><input id="background-color" type="color" value="#0b1114"><output id="background-color-value" for="background-color">#0B1114</output></label>
          </div>
        </fieldset>
        <fieldset class="control-section spectrum-settings" disabled>
          <div class="section-heading"><h3>Spectrum</h3><button class="text-button" data-reset="spectrum" aria-label="Reset spectrum">Reset</button></div>
          <div class="slider-field"><label class="slider-label" for="radius">Shape size <output id="radius-value" for="radius">115 px</output></label><input id="radius" type="range" min="55" max="140" value="115"></div>
          <div class="slider-field"><label class="slider-label" for="sensitivity">Reactivity <output id="sensitivity-value" for="sensitivity">1.2×</output></label><input id="sensitivity" type="range" min="0.3" max="2.5" step="0.1" value="1.2"></div>
          <div class="slider-field"><label class="slider-label" for="bars">Bands <output id="bars-value" for="bars">128</output></label><input id="bars" type="range" min="32" max="192" step="16" value="128"></div>
          <div class="slider-field"><label class="slider-label" for="rotation">Spectrum rotation <output id="rotation-value" for="rotation">90°</output></label><input id="rotation" type="range" min="0" max="180" step="1" value="90" title="Move bass down both sides symmetrically: 0° top, 90° sides, 180° bottom"></div>
          <div class="slider-field"><label class="slider-label" for="smoothing">Smoothing <output id="smoothing-value" for="smoothing">0%</output></label><input id="smoothing" type="range" min="0" max="100" step="1" value="0" title="0% sharp peaks · 100% smooth outline"></div>
        </fieldset>
        <fieldset class="control-section effects-settings" disabled>
          <div class="section-heading"><h3>Effects</h3><button class="text-button" data-reset="effects" aria-label="Reset effects">Reset</button></div>
          <div class="effects-grid">
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="glowStrength"><span class="effect-name" tabindex="0" data-effect-tip="Softens the spectrum and outline with colored light. Its glow follows the reacting bars and waves.">Glow</span> <button type="button" class="effect-percentage" id="glowStrength-value">100%</button></label><input id="glowStrength" type="range" min="0" max="200" step="5" value="100" aria-label="glow strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="pulseStrength"><span class="effect-name" tabindex="0" data-effect-tip="Expands the main shape with bass energy, then eases back between hits.">Bass pulse</span> <button type="button" class="effect-percentage" id="pulseStrength-value">100%</button></label><input id="pulseStrength" type="range" min="0" max="200" step="5" value="100" aria-label="pulse strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="orbitLightsStrength"><span class="effect-name" tabindex="0" data-effect-tip="Two lights orbit beyond the spectrum and brighten with bass energy.">Orbiting lights</span> <button type="button" class="effect-percentage" id="orbitLightsStrength-value">100%</button></label><input id="orbitLightsStrength" type="range" min="0" max="200" step="5" value="100" aria-label="orbitLights strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="echoRingsStrength"><span class="effect-name" tabindex="0" data-effect-tip="Outlines emerge behind the shape on every fourth detected beat. Timing follows the uploaded track.">Echo rings</span> <button type="button" class="effect-percentage" id="echoRingsStrength-value">100%</button></label><input id="echoRingsStrength" type="range" min="0" max="200" step="5" value="100" aria-label="echoRings strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="auraStrength"><span class="effect-name" tabindex="0" data-effect-tip="Adds a soft colored haze behind the shape. Strength controls its steady brightness.">Aura</span> <button type="button" class="effect-percentage" id="auraStrength-value">100%</button></label><input id="auraStrength" type="range" min="0" max="200" step="5" value="100" aria-label="aura strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="particlesStrength"><span class="effect-name" tabindex="0" data-effect-tip="Drifting particles speed up with bass energy and brighten on detected attacks.">Particles</span> <button type="button" class="effect-percentage" id="particlesStrength-value">100%</button></label><input id="particlesStrength" type="range" min="0" max="200" step="5" value="100" aria-label="particles strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="flashesStrength"><span class="effect-name" tabindex="0" data-effect-tip="A broad, soft flash rises on bass attacks and fades smoothly.">Beat flashes</span> <button type="button" class="effect-percentage" id="flashesStrength-value">100%</button></label><input id="flashesStrength" type="range" min="0" max="200" step="5" value="100" aria-label="flashes strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="vignetteStrength"><span class="effect-name" tabindex="0" data-effect-tip="Darkens the edges to frame the visualizer. This effect stays steady rather than following beats.">Vignette</span> <button type="button" class="effect-percentage" id="vignetteStrength-value">100%</button></label><input id="vignetteStrength" type="range" min="0" max="200" step="5" value="100" aria-label="vignette strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="nebulaStrength"><span class="effect-name" tabindex="0" data-effect-tip="Slowly moving color clouds expand and brighten with bass energy.">Nebula</span> <button type="button" class="effect-percentage" id="nebulaStrength-value">0%</button></label><input id="nebulaStrength" type="range" min="0" max="200" step="5" value="0" aria-label="Nebula strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="auroraStrength"><span class="effect-name" tabindex="0" data-effect-tip="Flowing ribbons sweep across the background. Bass increases their movement and beats brighten them.">Aurora</span> <button type="button" class="effect-percentage" id="auroraStrength-value">0%</button></label><input id="auroraStrength" type="range" min="0" max="200" step="5" value="0" aria-label="Aurora strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="constellationStrength"><span class="effect-name" tabindex="0" data-effect-tip="Drifting points form changing connections. Bass speeds their motion and beats illuminate the network.">Constellation</span> <button type="button" class="effect-percentage" id="constellationStrength-value">0%</button></label><input id="constellationStrength" type="range" min="0" max="200" step="5" value="0" aria-label="Constellation strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="gridStrength"><span class="effect-name" tabindex="0" data-effect-tip="A moving floor and ceiling form a perspective tunnel. Bass speeds the flow and brightens the lines.">Perspective grid</span> <button type="button" class="effect-percentage" id="gridStrength-value">0%</button></label><input id="gridStrength" type="range" min="0" max="200" step="5" value="0" aria-label="Perspective grid strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="firefliesStrength"><span class="effect-name" tabindex="0" data-effect-tip="Soft floating lights wander with the music and flare on detected attacks.">Fireflies</span> <button type="button" class="effect-percentage" id="firefliesStrength-value">0%</button></label><input id="firefliesStrength" type="range" min="0" max="200" step="5" value="0" aria-label="Fireflies strength"></div></div>
            <div class="effect-control"><div class="slider-field"><label class="slider-label" for="scanlinesStrength"><span class="effect-name" tabindex="0" data-effect-tip="Fine horizontal lines drift down the frame and brighten on beats.">Scan lines</span> <button type="button" class="effect-percentage" id="scanlinesStrength-value">0%</button></label><input id="scanlinesStrength" type="range" min="0" max="200" step="5" value="0" aria-label="Scan lines strength"></div></div>
          </div>

        </fieldset>
        <fieldset class="control-section identity-settings" disabled>
          <div class="section-heading"><h3>Logo</h3><button class="text-button" data-reset="logo" aria-label="Reset logo">Reset</button></div>
          <div class="file-card logo-row" id="logo-card"><button id="logo-upload" class="file-upload"><svg class="file-add-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg><span class="file-copy"><strong id="logo-name">Add logo</strong><small id="logo-hint">PNG, JPG, WebP</small></span></button><button id="logo-remove" class="text-button file-remove" aria-label="Remove logo" hidden><span>Remove</span></button></div>
          <div id="logo-placement" class="is-disabled">
            <div class="style-choices logo-fit-choices" role="radiogroup" aria-label="Logo fit">
              <label class="style-choice"><input class="sr-only" type="radio" disabled name="logo-fit" value="contain"><span>Fit image</span></label>
              <label class="style-choice"><input class="sr-only" type="radio" disabled name="logo-fit" value="cover" checked><span>Fill shape</span></label>
            </div>
            <div class="slider-field"><label class="slider-label" for="logoOpacity">Opacity <output id="logoOpacity-value" for="logoOpacity">100%</output></label><input id="logoOpacity" type="range" min="0" max="100" value="100" disabled></div>
            <div class="slider-field"><label class="slider-label" for="logoZoom">Zoom <output id="logoZoom-value" for="logoZoom">100%</output></label><input id="logoZoom" type="range" disabled min="50" max="200" value="100"></div>
            <div class="slider-field"><label class="slider-label" for="logoX">Horizontal position <output id="logoX-value" for="logoX">0%</output></label><input id="logoX" type="range" disabled min="-100" max="100" value="0"></div>
            <div class="slider-field"><label class="slider-label" for="logoY">Vertical position <output id="logoY-value" for="logoY">0%</output></label><input id="logoY" type="range" disabled min="-100" max="100" value="0"></div>
          </div>
          <input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        </fieldset>
        <fieldset class="control-section background-settings" disabled>
          <div class="section-heading"><h3>Background Image</h3><button class="text-button" data-reset="backgroundImage" aria-label="Reset Background Image">Reset</button></div>
          <div class="file-card" id="background-image-card"><button id="background-image-upload" class="file-upload"><svg class="file-add-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg><span class="file-copy"><strong id="background-image-name">Add image</strong><small id="background-image-hint">PNG, JPG, WebP</small></span></button><button id="background-image-remove" class="text-button file-remove" aria-label="Remove background image" hidden><span>Remove</span></button></div>
          <div id="background-image-controls" class="is-disabled">
            <div class="style-choices background-fit-choices" role="radiogroup" aria-label="Background image fit">
              <label class="style-choice"><input class="sr-only" type="radio" name="background-fit" value="contain" disabled><span>Fit image</span></label>
              <label class="style-choice"><input class="sr-only" type="radio" name="background-fit" value="cover" checked disabled><span>Fill preview</span></label>
            </div>
            <div class="slider-field"><label class="slider-label" for="backgroundOpacity">Opacity <output id="backgroundOpacity-value" for="backgroundOpacity">100%</output></label><input id="backgroundOpacity" type="range" min="0" max="100" value="100" disabled></div>
            <div class="slider-field"><label class="slider-label" for="backgroundZoom">Zoom <output id="backgroundZoom-value" for="backgroundZoom">100%</output></label><input id="backgroundZoom" type="range" min="50" max="200" value="100" disabled></div>
            <div class="slider-field"><label class="slider-label" for="backgroundX">Horizontal position <output id="backgroundX-value" for="backgroundX">0%</output></label><input id="backgroundX" type="range" min="-100" max="100" value="0" disabled></div>
            <div class="slider-field"><label class="slider-label" for="backgroundY">Vertical position <output id="backgroundY-value" for="backgroundY">0%</output></label><input id="backgroundY" type="range" min="-100" max="100" value="0" disabled></div>
          </div>
          <input id="background-image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        </fieldset>
        <fieldset class="control-section text-settings" disabled>
          <div class="section-heading"><h3>Text</h3><button class="text-button" data-reset="text" aria-label="Reset text">Reset</button></div>
          <label class="text-input-control" for="title">Display text<input id="title" type="text" placeholder="Enter a title or message" maxlength="50"></label>
          <div class="select-row text-style-pair">
            <label class="text-font-control" for="textFont">Font<select id="textFont"><option value="poppins" selected>Poppins</option><option value="inter">Inter</option><option value="montserrat">Montserrat</option><option value="lato">Lato</option><option value="roboto">Roboto</option><option value="opensans">Open Sans</option><option value="lora">Lora</option><option value="nunito">Nunito</option><option value="raleway">Raleway</option><option value="oswald">Oswald</option><option value="playfair">Playfair Display</option><option value="merriweather">Merriweather</option><option value="rubik">Rubik</option><option value="bebas">Bebas Neue</option><option value="tektur">Tektur</option><option value="sans">Arial</option><option value="serif">Georgia</option><option value="mono">Courier New</option></select></label>
            <label class="text-color-control" for="textColor-color"><span class="color-caption">Color</span><span class="text-color-field"><input id="textColor-color" type="color" value="#eeeff2"><output id="textColor-color-value" for="textColor-color">#EEEFF2</output></span></label>
          </div>
          <div class="text-format-row">
            <div class="slider-field"><label class="slider-label" for="textSize">Size <output id="textSize-value" for="textSize">100%</output></label><input id="textSize" type="range" min="50" max="200" step="5" value="100"></div>
          </div>
        </fieldset>
        <fieldset class="control-section export-settings" disabled>
          <div class="section-heading"><h3>Export</h3><button class="text-button" data-reset="export" aria-label="Reset export">Reset</button></div>
          <div class="select-row">
            <label for="resolution">Resolution<select id="resolution"><option value="640x360">360p</option><option value="854x480">480p</option><option value="1280x720" selected>720p</option><option value="1920x1080">1080p</option><option value="2560x1440">1440p</option><option value="3840x2160">4K</option></select></label>
            <label for="fps">Frame rate<select id="fps"><option value="15">15 FPS</option><option value="24">24 FPS</option><option value="25">25 FPS</option><option value="30" selected>30 FPS</option><option value="50">50 FPS</option><option value="60">60 FPS</option><option value="120">120 FPS</option></select></label>
          </div>
          <p id="export-support-note" class="export-support-note" role="status" hidden></p>
        </fieldset>
      </div>

    </aside>
  </main>
  <dialog id="reset-dialog" aria-labelledby="reset-dialog-title" aria-describedby="reset-dialog-detail">
    <form method="dialog">
      <h2 id="reset-dialog-title"></h2><p id="reset-dialog-detail"></p>
      <div class="dialog-actions"><button id="reset-cancel" class="secondary" value="cancel" autofocus>Cancel</button><button class="primary" value="reset">Reset</button></div>
    </form>
  </dialog>
  <p id="status" role="status" hidden></p>
  <audio id="audio" preload="metadata"></audio>
  <script type="module" src="./app.js"></script>
</body>
</html>
